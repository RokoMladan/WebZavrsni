{% extends 'gallery/base.html' %}
{% block title %}Brisanje — Artis{% endblock %}
{% block content %}

<div class="max-w-md text-center mx-auto mt-16">
    <h1 class="text-3xl font-light mb-4">Potvrdi brisanje</h1>
    <p class="text-stone-400 mb-8">Jesi li siguran da želiš obrisati <span class="text-white">{{ object }}</span>? Ova radnja je nepovratna.</p>
    <form method="post" class="flex justify-center gap-4">
        {% csrf_token %}
        <button type="submit" class="bg-red-500 text-white px-6 py-2 rounded hover:bg-red-400 transition">Obriši</button>
        <a href="javascript:history.back()" class="border border-stone-600 px-6 py-2 rounded hover:border-amber-400 transition">Odustani</a>
    </form>
</div>

{% endblock %}
