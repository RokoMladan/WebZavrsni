<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    {% for artwork in artworks %}
    <div class="bg-stone-900 rounded p-4 hover:border hover:border-amber-400 transition border border-transparent">
        {% if artwork.image %}
            <img src="{{ artwork.image.url }}" class="w-full h-48 object-contain bg-stone-800 rounded mb-3">
        {% else %}
            <div class="w-full h-48 bg-stone-800 rounded mb-3 flex items-center justify-center text-stone-600">Bez slike</div>
        {% endif %}
        <a href="{% url 'artwork-detail' artwork.pk %}" class="text-lg hover:text-amber-400 transition">{{ artwork.title }}</a>
        <p class="text-stone-400 text-sm mt-1">{{ artwork.artist.name }} · {{ artwork.year }}</p>
    </div>
    {% empty %}
    <p class="text-stone-500 col-span-3">Nema rezultata.</p>
    {% endfor %}
</div>
